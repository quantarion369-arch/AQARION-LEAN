name: p2-bridge
on:
  push:
    branches: ["main"]
    paths:
      - "P2-SEMIGROUP/p2-bridge/**"
      - "P2-SEMIGROUP/p2-core/**"
      - ".github/workflows/p2-bridge.yml"
  workflow_dispatch:
permissions:
  contents: read
env:
  ELAN_COMMIT: 3cc76985a1becb3c03cd65c1c5007e6f186ae474
  ELAN_SHA256: a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: P2-SEMIGROUP/p2-bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          set -euo pipefail
          curl -sSfL "https://raw.githubusercontent.com/leanprover/elan/${ELAN_COMMIT}/elan-init.sh" -o "$RUNNER_TEMP/elan-init.sh"
          echo "${ELAN_SHA256}  $RUNNER_TEMP/elan-init.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and gate
        run: |
          set -euo pipefail
          if [ ! -f lake-manifest.json ]; then
            echo "MANIFEST_NOT_PINNED: resolving once"
            lake update
          fi
          lake exe cache get
          lake build 2>&1 | tee build.log
          python3 - <<'PY'
          import re
          t = open("build.log").read()
          dep = re.findall(r"depends on axioms: \[([^\]]*)\]", t)
          none = len(re.findall(r"does not depend on any axioms", t))
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          bad = [x for x in dep if not {s.strip() for s in x.split(",") if s.strip()} <= allowed]
          print("AXIOM_REPORTS", len(dep) + none, "BAD", bad, "SORRYAX", "sorryAx" in t)
          assert len(dep) + none >= 1 and not bad and "sorryAx" not in t and "declaration uses" not in t
          PY
      - name: Surface errors as annotations
        if: failure()
        run: |
          msg="$(grep -A8 'error' build.log | head -40 | awk 'BEGIN{ORS="%0A"}{print}' || true)"
          echo "::error title=lean-errors::${msg}"
      - name: Report axioms as notice
        if: success()
        run: |
          msg="$(grep -E 'depends on axioms|does not depend|declaration uses' build.log | awk 'BEGIN{ORS="%0A"}{print}' || true)"
          echo "::notice title=lean-summary::${msg}"
      - name: Emit manifest for pinning
        if: success()
        run: |
          i=0
          base64 -w0 lake-manifest.json | fold -w 3000 | while IFS= read -r chunk || [ -n "$chunk" ]; do
            i=$((i+1))
            echo "::notice title=lake-manifest-b64-${i}::${chunk}"
          done
