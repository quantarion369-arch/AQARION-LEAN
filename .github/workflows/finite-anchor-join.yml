name: Finite-anchor Lean verification
"on":
  push:
    branches: [main]
    paths:
      - 'PROJECTS/FiniteAnchorJoinRigidity/**'
      - '.github/workflows/finite-anchor-join.yml'
  pull_request:
    branches: [main]
    paths:
      - 'PROJECTS/FiniteAnchorJoinRigidity/**'
      - '.github/workflows/finite-anchor-join.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check source hashes and compiler pin
        run: bash PROJECTS/FiniteAnchorJoinRigidity/verify.sh --check-only
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat PROJECTS/FiniteAnchorJoinRigidity/lean-toolchain)"
      - name: Fresh build and axiom audit
        shell: bash
        run: |
          set -euo pipefail
          timeout 900 bash PROJECTS/FiniteAnchorJoinRigidity/verify.sh | tee "$RUNNER_TEMP/finite-anchor-ci.log"
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finite-anchor-diagnostics
          path: |
            ${{ runner.temp }}/finite-anchor-ci.log
            /tmp/finite-anchor-verify-*/*.log
            /tmp/finite-anchor-verify-*/context.txt
          if-no-files-found: ignore
