name: p2-skeleton-cases
on:
  push:
    branches: ["main"]
    paths:
      - "P2-SEMIGROUP/p2-mathlib/P2Skeleton/**"
      - "P2-SEMIGROUP/p2-mathlib/P2Skeleton.lean"
      - ".github/workflows/p2-skeleton-cases.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p2-skeleton-cases-${{ github.ref }}
  cancel-in-progress: false
env:
  ELAN_COMMIT: 3cc76985a1becb3c03cd65c1c5007e6f186ae474
  ELAN_SHA256: a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53
jobs:
  case:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        module: [D3Deg8C, D3Deg9C]
    defaults:
      run:
        working-directory: P2-SEMIGROUP/p2-mathlib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          set -euo pipefail
          curl -sSfL "https://raw.githubusercontent.com/leanprover/elan/${ELAN_COMMIT}/elan-init.sh" -o "$RUNNER_TEMP/elan-init.sh"
          echo "${ELAN_SHA256}  $RUNNER_TEMP/elan-init.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build one case
        run: |
          set -uo pipefail
          if [ ! -f lake-manifest.json ]; then lake update || exit 1; fi
          lake exe cache get || exit 1
          ls -l P2Skeleton/${{ matrix.module }}.lean
          ( while true; do echo "MEM $(date +%T) used_MB=$(free -m | awk 'NR==2{print $3}') avail_MB=$(free -m | awk 'NR==2{print $7}')"; sleep 20; done ) &
          SAMPLER=$!
          trap 'kill $SAMPLER 2>/dev/null || true' EXIT
          /usr/bin/time -v lake build P2Skeleton.${{ matrix.module }} 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "LAKE_EXIT=$rc"
          exit $rc
      - name: Report peak memory and time
        if: always()
        run: grep -E 'Maximum resident set size|Elapsed \(wall clock\)' build.log || true
      - name: Surface errors as annotations
        if: failure()
        run: |
          msg="$( (grep -A8 'error' build.log | head -30; echo '--- tail of build.log ---'; tail -n 15 build.log | cut -c1-300) | awk 'BEGIN{ORS="%0A"}{print}' || true)"
          echo "::error title=lean-errors::${msg}"
      - name: Report axioms as notice
        if: success()
        run: |
          msg="$(grep -E 'depends on axioms|does not depend|declaration uses' build.log | awk 'BEGIN{ORS="%0A"}{print}' || true)"
          echo "::notice title=lean-summary::${msg}"
